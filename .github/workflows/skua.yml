name: Skua
# Skua Bash's coreutils (RusticStack/coreutils, branch `skua`): build what Skua ships and run the tests that apply on Windows. Upstream workflows are disabled on this fork.
on:
  push:
    branches: [ skua ]
  pull_request:
    branches: [ skua ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  windows:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up rust toolchain
        shell: bash
        # No rust-toolchain file in this repo: stable, as upstream's CICD uses.
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build (as Skua Bash builds it)
        # Same command as skua-bash skua/build-uutils.ps1 (skua/uutils.toml).
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --features windows,stat,chmod --bin coreutils
      - name: Test coreutils (tests/by-util for every util Skua ships)
        # Upstream's Windows test recipe (CICD.yml build_rust_stable) with Skua's feature set:
        # feat_os_windows + stat + chmod, so test_ls, test_stat_windows and test_chmod_windows run.
        # Exactly 8 tests are excluded (the rest of the suite still runs):
        shell: bash
        env:
          # Windows chmod parses its own options and returns an unlocalized/uncoloured UUsageError
          # (8da1f887a); Skua Bash is English-only.
          SKIP_CHMOD_L10N: >-
            binary_id(coreutils::test_localization_and_colors) & (
            test(=test_error_messages_have_colors) |
            test(=test_error_messages_french_translation) |
            test(=test_help_messages_french_translation) |
            test(=test_french_colored_error_messages))
          # chmod is a checked no-op on Windows (Skua M3-SH5, commit 8da1f887a): permission-dependent
          # tests can't hold.
          SKIP_CHMOD_PERMS: >-
            binary_id(coreutils::tests) & (
            test(=test_ls::test_ls_io_errors) |
            test(=test_rm::test_prompt_write_protected_yes) |
            test(=test_rm::test_prompt_write_protected_no) |
            test(=test_rm::test_prompts))
        run: cargo nextest run --hide-progress-bar --profile ci --locked --features windows,stat,chmod -E "not ((${SKIP_CHMOD_L10N}) | (${SKIP_CHMOD_PERMS}))"
      - name: Test uucore and the crates Skua changed (unit tests)
        shell: bash
        env:
          # Upstream tests, run on Ubuntu only upstream: Windows SystemTime cannot hold
          # UNIX_EPOCH +/- 6.7e16 s, so the test's own setup overflows (not a Skua change).
          SKIP_WINDOWS_SYSTEMTIME: >-
            package(uucore) & (
            test(=features::time::tests::test_large_system_time) |
            test(=features::time::tests::test_large_system_time_float))
        run: cargo nextest run --hide-progress-bar --profile ci --locked -p uucore -p uu_ls -p uu_stat -p uu_chmod -p uu_cat -p uu_tail -p uu_tr -p uu_yes --no-tests=warn -E "not (${SKIP_WINDOWS_SYSTEMTIME})"
